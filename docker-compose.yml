services:
  db:
    image: postgres:17-alpine
    container_name: barberapp-db
    environment:
      POSTGRES_DB: barberapp
      POSTGRES_USER: barberapp
      POSTGRES_PASSWORD: barberapp
    ports:
      - "5432:5432"
    volumes:
      - barberapp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberapp -d barberapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  barberapp-db-data: